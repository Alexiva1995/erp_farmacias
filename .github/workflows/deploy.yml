name: Deploy ERP Farmacias

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-deploy:
    name: Build Frontend & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar versión de PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv
          coverage: none

      # 3. Configurar Node.js y PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. Crear .env temporal y generar key en el runner para evitar errores de Laravel
      - name: Create Temporary .env
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --ansi || true

      # 5. Instalar dependencias de Composer en el Runner (sin scripts para evitar fallos de BD)
      - name: Install Composer Dependencies
        run: composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader

      # 6. Instalar dependencias de Node y Compilar Frontend con Vite
      - name: Build Frontend Assets
        run: |
          pnpm install
          pnpm run build

      # 7. Transferir archivos compilados (public/build) al servidor
      - name: Transfer Compiled Assets to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        if: ${{ secrets.SSH_HOST != '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/build"
          target: ${{ secrets.DEPLOY_PATH || '/home/farmaciabs/public_html/erp3' }}
          strip_components: 0

      # 8. Ejecutar actualización de backend y optimización en el Servidor (cPanel)
      - name: Execute Remote Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.SSH_HOST != '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/home/farmaciabs/public_html/erp3' }}
            git pull origin ${{ github.ref_name }}
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true

