name: ERP Farmacias CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - mejora

jobs:
  test-and-build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar versión de PHP 8.3 con extensiones necesarias
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      # 3. Configurar Node.js y PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. Configurar entorno .env y base de datos SQLite para pruebas
      - name: Prepare Environment & SQLite Database
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          mkdir -p database
          touch database/database.sqlite

      # 5. Instalar dependencias de Composer
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 6. Generar APP_KEY de Laravel (requiere vendor/autoload.php)
      - name: Generate Application Key
        run: php artisan key:generate

      # 7. Ejecutar suite de pruebas
      - name: Execute Tests via PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      # 8. Instalar dependencias de Frontend y Compilar con Vite
      - name: Build Frontend Assets (Vite)
        run: |
          pnpm install
          pnpm run build

      # 9. Guardar assets compilados como artefacto para despliegue
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: public/build
          retention-days: 1

  deploy:
    name: Deploy to ${{ matrix.target.name }}
    needs: test-and-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - id: 1
            name: "Servidor 1 (farmaciabs)"
          - id: 2
            name: "Servidor 2 (tovaerp)"

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Descargar artefactos compilados en el job anterior
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-assets
          path: public/build

      # 3. Determinar credenciales y rutas según el servidor destino
      - name: Set Server Target Environment
        id: set_env
        run: |
          if [ "${{ matrix.target.id }}" = "1" ]; then
            echo "user=${{ secrets.SERVER_USER || 'farmaciabs' }}" >> "$GITHUB_OUTPUT"
            echo "path=${{ secrets.DEPLOY_PATH || '/home/farmaciabs/public_html/erp3' }}" >> "$GITHUB_OUTPUT"
            echo "key<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ secrets.SERVER_KEY || secrets.SSH_KEY }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "passphrase=${{ secrets.SERVER_PASSPHRASE || secrets.SSH_PASSPHRASE }}" >> "$GITHUB_OUTPUT"
            echo "password=${{ secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD }}" >> "$GITHUB_OUTPUT"
          else
            echo "user=${{ secrets.SERVER_2_USER || 'tovaerp' }}" >> "$GITHUB_OUTPUT"
            echo "path=${{ secrets.SERVER_2_DEPLOY_PATH || '/home/tovaerp/zorcasalud.tovaerp.com' }}" >> "$GITHUB_OUTPUT"
            echo "key<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ secrets.SERVER_2_KEY || secrets.SERVER_KEY || secrets.SSH_KEY }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "passphrase=${{ secrets.SERVER_2_PASSPHRASE || secrets.SERVER_PASSPHRASE || secrets.SSH_PASSPHRASE }}" >> "$GITHUB_OUTPUT"
            echo "password=${{ secrets.SERVER_2_PASSWORD || secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD }}" >> "$GITHUB_OUTPUT"
          fi

      # 4. Transferir archivos compilados vía SCP al servidor correspondiente
      - name: Transfer Compiled Assets to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '162.240.166.50' }}
          username: ${{ steps.set_env.outputs.user }}
          key: ${{ steps.set_env.outputs.key }}
          passphrase: ${{ steps.set_env.outputs.passphrase }}
          password: ${{ steps.set_env.outputs.password }}
          port: ${{ secrets.SERVER_PORT || 22022 }}
          source: "public/build"
          target: ${{ steps.set_env.outputs.path }}
          strip_components: 0

      # 5. Ejecutar actualización remota, migraciones y cachés vía SSH
      - name: Execute Remote Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '162.240.166.50' }}
          username: ${{ steps.set_env.outputs.user }}
          key: ${{ steps.set_env.outputs.key }}
          passphrase: ${{ steps.set_env.outputs.passphrase }}
          password: ${{ steps.set_env.outputs.password }}
          port: ${{ secrets.SERVER_PORT || 22022 }}
          script: |
            cd ${{ steps.set_env.outputs.path }}
            git pull origin ${{ github.ref_name }}
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
