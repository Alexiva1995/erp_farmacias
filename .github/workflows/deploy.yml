name: ERP Farmacias CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - mejora

jobs:
  test-and-build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar versión de PHP 8.3 con extensiones necesarias
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      # 3. Configurar Node.js y PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. Configurar entorno .env y base de datos SQLite para pruebas
      - name: Prepare Environment & SQLite Database
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          mkdir -p database
          touch database/database.sqlite

      # 5. Instalar dependencias de Composer
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 6. Generar APP_KEY de Laravel (requiere vendor/autoload.php)
      - name: Generate Application Key
        run: php artisan key:generate

      # 7. Ejecutar suite de pruebas
      - name: Execute Tests via PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      # 8. Instalar dependencias de Frontend y Compilar con Vite
      - name: Build Frontend Assets (Vite)
        run: |
          pnpm install
          pnpm run build

      # 9. Guardar assets compilados como artefacto para despliegue
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: public/build
          retention-days: 1

  # Despliegue en Servidor 1 (farmaciabs)
  deploy-server-1:
    name: Deploy to Servidor Principal (farmaciabs)
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-assets
          path: public/build

      - name: Transfer Compiled Assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '162.240.166.50' }}
          username: ${{ secrets.SERVER_USER || 'farmaciabs' }}
          key: ${{ secrets.SERVER_KEY || secrets.SSH_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE || secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22022 }}
          source: "public/build"
          target: ${{ secrets.DEPLOY_PATH || '/home/farmaciabs/public_html/erp3' }}
          strip_components: 0

      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '162.240.166.50' }}
          username: ${{ secrets.SERVER_USER || 'farmaciabs' }}
          key: ${{ secrets.SERVER_KEY || secrets.SSH_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE || secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22022 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/home/farmaciabs/public_html/erp3' }}
            git pull origin ${{ github.ref_name }}
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true

  # Despliegue en Servidor 2 (tovaerp)
  deploy-server-2:
    name: Deploy to Servidor Secundario (tovaerp)
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-assets
          path: public/build

      - name: Transfer Compiled Assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '162.240.166.50' }}
          username: ${{ secrets.SERVER_2_USER || 'tovaerp' }}
          key: ${{ secrets.SERVER_2_KEY || secrets.SERVER_KEY || secrets.SSH_KEY }}
          passphrase: ${{ secrets.SERVER_2_PASSPHRASE || secrets.SERVER_PASSPHRASE || secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_2_PASSWORD || secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22022 }}
          source: "public/build"
          target: ${{ secrets.SERVER_2_DEPLOY_PATH || '/home/tovaerp/zorcasalud.tovaerp.com' }}
          strip_components: 0

      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '162.240.166.50' }}
          username: ${{ secrets.SERVER_2_USER || 'tovaerp' }}
          key: ${{ secrets.SERVER_2_KEY || secrets.SERVER_KEY || secrets.SSH_KEY }}
          passphrase: ${{ secrets.SERVER_2_PASSPHRASE || secrets.SERVER_PASSPHRASE || secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_2_PASSWORD || secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22022 }}
          script: |
            cd ${{ secrets.SERVER_2_DEPLOY_PATH || '/home/tovaerp/zorcasalud.tovaerp.com' }}
            git pull origin ${{ github.ref_name }}
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
