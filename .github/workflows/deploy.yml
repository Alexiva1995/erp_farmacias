name: ERP Farmacias CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - mejora

jobs:
  test-build-deploy:
    name: Test, Build & Deploy Pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar versión de PHP 8.3 con extensiones necesarias
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      # 3. Configurar Node.js y PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. Configurar entorno .env y base de datos SQLite para pruebas
      - name: Prepare Environment & SQLite Database
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          mkdir -p database
          touch database/database.sqlite

      # 5. Instalar dependencias de Composer
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 6. Generar APP_KEY de Laravel (requiere vendor/autoload.php)
      - name: Generate Application Key
        run: php artisan key:generate

      # 7. Ejecutar suite de pruebas (95 tests)
      - name: Execute Tests via PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      # 7. Instalar dependencias de Frontend y Compilar con Vite en el Runner
      - name: Build Frontend Assets (Vite)
        run: |
          pnpm install
          pnpm run build

      # 8. Transferir archivos compilados (public/build) directamente al servidor vía SCP
      - name: Transfer Compiled Assets to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/build"
          target: ${{ secrets.DEPLOY_PATH || '/home/farmaciabs/public_html/erp3' }}
          strip_components: 0

      # 9. Ejecutar actualización remota, migraciones y cachés en el Servidor (cPanel)
      - name: Execute Remote Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/home/farmaciabs/public_html/erp3' }}
            git pull origin ${{ github.ref_name }}
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
