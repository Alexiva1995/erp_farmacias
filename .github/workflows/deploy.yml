name: Deploy ERP Farmacias

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-deploy:
    name: Build Frontend & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar versión de PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv
          coverage: none

      # 3. Configurar Node.js y PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. Instalar dependencias de Composer
      - name: Install Composer Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # 5. Instalar dependencias de Frontend y Compilar en el Runner de GitHub (16GB RAM)
      - name: Install Node Dependencies & Build Assets in GitHub Runner
        run: |
          pnpm install
          pnpm run build

      # 6. Transferir archivos compilados (public/build) directamente al servidor vía SCP
      - name: Transfer Compiled Assets to Server
        uses: appleboy/scp-action@v0.1.7
        if: ${{ secrets.SSH_HOST != '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/build"
          target: ${{ secrets.DEPLOY_PATH || '/var/www/erp_farmacias' }}

      # 7. Ejecutar actualización de backend y cachés en el Servidor vía SSH (Sin compilar en servidor)
      - name: Execute Remote Update on Server
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.SSH_HOST != '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/var/www/erp_farmacias' }}
            git pull origin ${{ github.ref_name }}
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true

