<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conector Cobeca / Mafarta</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #1e293b;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #0f172a;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 999px;
      background: #e0e7ff;
      color: #4338ca;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
      color: #475569;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 9px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      background: #f1f5f9;
      font-size: 12px;
    }
    .status-text {
      font-weight: bold;
      color: #059669;
    }
    .open-portal {
      margin-top: 8px;
      background: #10b981;
    }
    .open-portal:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <h3>
    ⚡ Conector Cobeca
    <span class="badge">ERP Sync</span>
  </h3>
  <p style="font-size: 11px; color: #64748b; margin-top: 0; margin-bottom: 12px;">
    Inicia sesión en Cobeca normalmente; esta extensión envía el token de sesión al ERP para omitir Cloudflare.
  </p>

  <label for="erpUrl">URL del ERP Farmacias:</label>
  <input type="text" id="erpUrl" placeholder="https://tu-erp-farmacias.com">

  <button id="saveBtn">Guardar Conexión</button>
  <button id="syncNowBtn" style="background: #f59e0b; margin-top: 6px;">⚡ Enviar Sesión Actual al ERP</button>
  <button id="openPortalBtn" class="open-portal">Abrir Portal Cobeca SIC</button>

  <div class="status-box">
    <div>Estado: <span id="syncStatus" class="status-text">Listo</span></div>
    <div style="font-size: 10px; color: #64748b; margin-top: 4px;">Último envío: <span id="syncTime">Ninguno</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
